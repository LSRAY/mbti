[project]
name = "wordmbti_crew"
version = "0.1.0"
description = "wordmbti: 多智能体协作，从一段文字推断写作者的 MBTI（荣格八维功能栈）"
authors = [{ name = "wordmbti" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools,anthropic]>=1.15.41,<2",
]

[project.scripts]
wordmbti_crew = "wordmbti_crew.main:run"
run_crew = "wordmbti_crew.main:run"
train = "wordmbti_crew.main:train"
replay = "wordmbti_crew.main:replay"
test = "wordmbti_crew.main:test"
run_with_trigger = "wordmbti_crew.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wordmbti_crew"]

[tool.crewai]
type = "crew"
