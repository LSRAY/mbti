research_task:
  description: >
    研究重点：{focus}


    网站现在的判断规则如下，先读懂它，找出规则里还没写到、或者写得太笼统的地方，再去搜索：

    [[METHOD]]


    用 web_search 工具搜索，每次只问一个具体问题，总共不超过 {max_searches} 次。
    重点找“写法”层面的特征：句式、段落结构、怎么转折、怎么下结论、压力下的写法变化。
    每条发现都要写：涉及哪个类型或功能、具体特征、一个示例句（可以自己仿写）、来源网址和来源类型。
  expected_output: >
    中文的发现清单，每条包含：类型或功能、特征描述、示例句、来源网址、来源类型。
  agent: researcher

validate_task:
  description: >
    网站现在的判断规则（包含已确认的四个例子）：

    [[METHOD]]


    逐条审核研究员的发现，每条给出“通过 / 不通过”和理由。判断标准：
    1. 有没有可靠来源，是不是只是网友的个人印象；
    2. 能不能用功能栈解释（主导、辅助、第三位、劣势），而不是只靠类型标签；
    3. 是写法特征还是话题特征（话题特征一律不通过）；
    4. 会不会让已确认的四个例子被判错；
    5. 和现有规则是否重复（重复的不通过，除非能让现有规则更具体）。
  expected_output: >
    中文。逐条的审核结果（通过 / 不通过 + 理由），最后单独列出所有通过的发现。
  agent: validator
  context:
    - research_task

edit_task:
  description: >
    这是网站现在的判断规则 METHOD 全文：

    [[METHOD]]


    根据审核员“通过”的发现修改它：
    1. 只做最小改动，保留原来的结构、编号、四个已确认例子和结尾的 16 组签名部分；
    2. 新规则要写成和原文一样的风格：简短、具体、用“= 某功能”的写法；
    3. 没有通过的发现一律不要写进去；如果没有值得改的，就原样返回并说明原因；
    4. 每处修改都列出：位置、原文、新文、理由（引用对应的发现）。
  expected_output: >
    修改清单和修改后的 METHOD 全文。
  agent: rule_editor
  context:
    - validate_task
